name: Diagnostic sources d'adresses (temporaire)

on:
  pull_request:
    paths: [".github/workflows/diagnostic.yml"]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder BANO et les exports régionaux
        run: |
          set +e
          for u in https://bano.openstreetmap.fr/data/bano-75.csv.gz https://bano.openstreetmap.fr/data/bano-69.csv.gz https://bano.openstreetmap.fr/data/bano-2A.csv.gz https://bano.openstreetmap.fr/data/ ; do
            curl -s -o /tmp/b -w "%{http_code} %{size_download}o $u\n" -m 300 "$u"
          done
          curl -s -m 300 https://bano.openstreetmap.fr/data/bano-75.csv.gz | zcat | head -3
          curl -s -m 60 https://bano.openstreetmap.fr/data/ | grep -o 'href="[^"]*"' | head -15
          for u in "https://data.iledefrance.fr/api/explore/v2.1/catalog/datasets/base-adresse-92/exports/csv?limit=3" "https://data.iledefrance.fr/api/explore/v2.1/catalog/datasets/base-dadresses-nationale-ouverte-bano-paris/exports/csv?limit=3" ; do
            echo "=== $u"; curl -s -m 120 "$u" | head -4
          done
          curl -s -o /dev/null -w "%{http_code} %{size_download}o idf-92 complet\n" -m 600 "https://data.iledefrance.fr/api/explore/v2.1/catalog/datasets/base-adresse-92/exports/csv"
