name: Diagnostic cadastre (temporaire)

on:
  pull_request:
    paths: [".github/workflows/diagnostic.yml"]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder le stockage
        run: |
          set +e
          S=https://cadastre.s3.rbx.io.cloud.ovh.net
          echo "=== liste adresses-cadastre/latest/csv/"; curl -s -m 60 "$S/?list-type=2&prefix=adresses-cadastre/latest/csv/&max-keys=8" | head -c 1500; echo
          echo "=== liste racine"; curl -s -m 60 "$S/?list-type=2&delimiter=/&max-keys=30" | grep -o "<Prefix>[^<]*</Prefix>" | head -30
          echo "=== liste adresses-cadastre/"; curl -s -m 60 "$S/?list-type=2&prefix=adresses-cadastre/&delimiter=/&max-keys=30" | grep -o "<Prefix>[^<]*</Prefix>" | head -30
          for u in $S/adresses-cadastre/latest/csv/adresses-cadastre-75.csv.gz $S/adresses-cadastre/latest/csv/adresses-cadastre-03.csv.gz $S/adresses-cadastre/latest/csv/adresses-cadastre-2A.csv.gz ; do
            curl -s -o /tmp/f.gz -w "%{http_code} %{size_download}o $u\n" -m 120 "$u"
          done
          zcat /tmp/f.gz 2>/dev/null | head -3
          curl -s -m 120 $S/adresses-cadastre/latest/csv/adresses-cadastre-75.csv.gz | zcat | head -3
          for b in ban adresse adresse-data-gouv adresses base-adresse-nationale ; do
            for path in "ban/adresses/latest/csv/adresses-75.csv.gz" "adresses/latest/csv/adresses-75.csv.gz" "" ; do
              curl -s -o /dev/null -w "%{http_code} %{size_download}o https://$b.s3.rbx.io.cloud.ovh.net/$path\n" -m 30 "https://$b.s3.rbx.io.cloud.ovh.net/$path"
            done
          done
          echo "=== ban sur le stockage du cadastre"
          curl -s -m 60 "$S/?list-type=2&prefix=ban&max-keys=5" | head -c 800; echo
