name: Diagnostic cadastre (temporaire)

on:
  pull_request:
    paths: [".github/workflows/diagnostic.yml"]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder le cadastre
        run: |
          set +e
          for u in https://cadastre.data.gouv.fr/data/adresses-cadastre/latest/csv/ https://cadastre.data.gouv.fr/data/adresses-cadastre/ https://cadastre.data.gouv.fr/data/ ; do
            echo "=== $u"; curl -s -i -m 30 "$u" | head -c 1500; echo
          done
          echo "=== data.gouv.fr : adresses extraites du cadastre"
          curl -s -m 30 https://www.data.gouv.fr/api/1/datasets/adresses-extraites-du-cadastre/ | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r.get('title'),'|',r.get('url'),'|',r.get('filesize'),'|',r.get('last_modified')) for r in d['resources']]"
          echo "=== BAN : autres jeux sur data.gouv.fr"
          curl -s -m 30 "https://www.data.gouv.fr/api/1/datasets/?q=base%20adresse%20nationale&organization=&page_size=10" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(x['slug'],'|',x.get('last_update'),'|',[r.get('url') for r in x['resources']][:3]) for x in d['data']]"
          for u in https://cadastre.data.gouv.fr/data/adresses-cadastre/latest/csv/adresses-cadastre-75.csv.gz https://cadastre.data.gouv.fr/data/adresses-cadastre/latest/csv/75.csv.gz https://cadastre.data.gouv.fr/data/etalab-cadastre/latest/ ; do
            curl -s -o /dev/null -w "%{http_code} %{size_download}o %{redirect_url} $u\n" -m 60 "$u"
          done
