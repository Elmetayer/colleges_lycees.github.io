name: Explorer les données de sectorisation (temporaire)

on:
  push:
    branches: ["jalon-3-*"]
    paths: ["pipeline/explorer_secteurs.py", ".github/workflows/explorer-secteurs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python pipeline/explorer_secteurs.py
