<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carte scolaire</title>
  <meta name="description" content="Collèges de France métropolitaine, lycées des académies de Paris et de Versailles, et leurs indicateurs : IPS, brevet, bac, valeur ajoutée, évaluations de 6e.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css?v=__VERSION__" rel="stylesheet">
</head>
<body class="page-carte">
  <header class="barre">
    <a class="titre" href="./">Carte scolaire</a>
    <div class="recherche" role="search">
      <label class="sr-only" for="recherche">Rechercher un collège, un lycée, une commune ou une adresse</label>
      <input id="recherche" type="search" autocomplete="off" spellcheck="false"
             placeholder="Établissement, commune ou adresse"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
      <ul id="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
    </div>
    <a class="lien-doc" href="documentation.html">Documentation</a>
  </header>

  <main id="carte" aria-label="Carte des collèges et des lycées"></main>

  <section class="panneau" id="panneau" aria-label="Calques de la carte">
    <button type="button" class="panneau-tete" id="panneau-tete" aria-expanded="true" aria-controls="calques">
      <span class="panneau-titre">Calques</span>
      <span class="compte" id="compte"></span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="calques" id="calques"></div>
    <p class="etat" id="etat">Chargement des établissements…</p>
  </section>

  <aside class="fiche" id="fiche" hidden aria-labelledby="fiche-nom">
    <button class="fermer" id="fermer" type="button" aria-label="Fermer la fiche">×</button>
    <div class="fiche-contenu" id="fiche-contenu"></div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="parametres.js?v=__VERSION__"></script>
  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
